# Local development: only the database. Run the app with `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fichas
      POSTGRES_PASSWORD: fichas
      POSTGRES_DB: fichas
    # 5433 so it does not clash with another local Postgres (e.g. wow-roster's).
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
