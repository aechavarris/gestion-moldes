name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fichas
          POSTGRES_PASSWORD: fichas
          POSTGRES_DB: fichas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fichas"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fichas:fichas@localhost:5432/fichas
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm build
      - run: docker build --target web -t fichas-web .

  # The host setup and backup scripts only run on the owner's friend's Windows PC: at least make sure they parse.
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1 -Path scripts, deploy | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
